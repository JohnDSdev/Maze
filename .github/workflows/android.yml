name: Build and install Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Export Godot Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Apply source compatibility and geometry fixes
        shell: bash
        run: |
          sed -i 's/var x := side \* (22.0 - depth \* 0.42)/var x: float = float(side) * (22.0 - depth * 0.42)/' scripts/world_builder.gd
          sed -i 's/Vector3(170, 0, 650), Vector3(465, 0, 650)/Vector3(165, 0, 650), Vector3(465, 0, 650)/' scripts/world_builder.gd
          sed -i 's/Vector3(1300, 0, 470), Vector3(1300, 0, 225)/Vector3(1300, 0, 455), Vector3(1300, 0, 220)/' scripts/world_builder.gd
          sed -i 's/Vector3(1300, 0, -225), Vector3(1300, 0, -470)/Vector3(1300, 0, -220), Vector3(1300, 0, -470)/' scripts/world_builder.gd
          if ! git diff --quiet -- scripts/world_builder.gd; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add scripts/world_builder.gd
            git commit -m "Close procedural world tunnel seams"
            git push
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "build-tools;35.0.1" "platforms;android-35" "cmdline-tools;latest"

      - name: Export debug APK with Godot 4.7.2
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          relative_project_path: ./
          presets_to_export: Android
          export_debug: true
          cache: true
          verbose: true

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p build/ci
          APK="$(find "${{ steps.export.outputs.build_directory }}" -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" build/ci/Maze.apk
          ls -lh build/ci/Maze.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: maze-android-apk
          path: build/ci/Maze.apk
          if-no-files-found: error

  install-test:
    name: Emulator install and launch test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: maze-android-apk
          path: build/ci

      - name: Boot emulator, install, and launch APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -e
            PACKAGE=com.johndsdev.brutalistmaze
            adb install -r build/ci/Maze.apk
            adb shell pm path "$PACKAGE" | grep '^package:'
            adb logcat -c
            adb shell monkey -p "$PACKAGE" -c android.intent.category.LAUNCHER 1
            sleep 8
            adb shell pidof "$PACKAGE"
            if adb logcat -d | grep -E 'SCRIPT ERROR|Parse Error|FATAL EXCEPTION'; then
              echo "Godot/Android reported a fatal or script error during launch."
              exit 1
            fi
